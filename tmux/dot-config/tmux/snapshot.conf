# tokens extracted from vim-airline/-theme highlight groups
# extraction script: https://github.com/dorukozerr/dotfiles/blob/main/bin/dot-local/bin/t_ap
# t_ap [theme] -w   (airline colors)
# t_ap -a -w        (terminal ANSI colors)

# >>> theme tokens (terminal ansi) >>>
%hidden BG="default"          # airline_c bg / background
%hidden BG_ALT="default"      # status fill            (airline_c bg)
%hidden SEL="brightblack"     # mid panel / section B  (airline_b bg)
%hidden FG_DIM="white"        # inactive text          (airline_c_inactive fg)
%hidden FG="brightwhite"      # section text           (airline_b fg)

# ---- airline section roles ----
# Section A = mode/title (highlighted), B = middle, C = outer status fill.
%hidden A_FG="black"
%hidden A_BG="blue"
%hidden B_FG="${FG}"
%hidden B_BG="${SEL}"
%hidden C_FG="${FG_DIM}"
%hidden C_BG="${BG_ALT}"
# <<< theme tokens <<<

set -g @left_sep ""
set -g @right_sep ""

# Map tmux's theme* colours to the terminal's ANSI palette
set -g theme terminal

# Transparent panes/popups/menus (bg=default lets the terminal bg through)
set -g window-style "bg=default"
set -g window-active-style "bg=default"
set -g popup-style "bg=default,fg=default"
set -g popup-border-style "bg=default,fg=${A_BG}"
set -g menu-style "bg=default,fg=default"
set -g menu-border-style "bg=default,fg=${A_BG}"

# Pane borders
# set -g pane-border-style "fg=${BG_ALT}"
# set -g pane-active-border-style "fg=${A_BG}"
set -g pane-border-style "fg=1"
set -g pane-active-border-style "fg=3"
set -g pane-border-lines single
set -g pane-border-indicators colour

# Copy mode (visual selection)
set -g mode-style "bg=${SEL},fg=${FG}"

# Command/message line
# fill=<bg> clears the whole line: tmux 3.6+ composites messages/prompts
# over the current status line, without fill the status bar bleeds through.
set -g message-style "bg=${SEL},fg=${FG},fill=${SEL}"
set -g message-command-style "bg=${SEL},fg=${FG},fill=${SEL}"

set -g allow-rename on
set -g automatic-rename on

# Status bar - matches airline with Section A, B, C
set -g status "on"
set -g status-justify "left"
set -g status-style "bg=${C_BG}"
set -g status-left-style "none"
set -g status-right-style "none"
set -g status-right-length "250"
set -g status-left-length "100"
set -g status-interval 1

set -g  status-left "#[fg=${A_FG},bg=${A_BG},bold] #S #[fg=${A_BG},bg=${B_BG},nobold,nounderscore,noitalics]#{@left_sep}"
set -ag status-left "#[fg=${B_FG},bg=${B_BG}] #I:#P #[fg=${B_BG},bg=${C_BG},nobold,nounderscore,noitalics]#{@left_sep}"

set -g status-right "#[fg=${A_BG},bg=${C_BG}]#{@right_sep}#[fg=${A_FG},bg=${A_BG},bold] #(t_tt status) #[fg=${A_BG},bg=${C_BG},nobold,nounderscore,noitalics]#{@left_sep}"
set -ag  status-right "#{session_dots} #[fg=${C_FG},bg=${C_BG},bold] #{now_playing} #[fg=${B_BG},bg=${C_BG}]#{@right_sep}"
set -ag status-right "#[fg=${B_FG},bg=${B_BG},bold] #(tmux-mem-cpu-load -m 2) #[fg=${A_BG},bg=${B_BG}]#{@right_sep}"
set -ag status-right "#[fg=${A_FG},bg=${A_BG},bold] %R "

# Separators always draw the solid section as fg over the fill as bg: with a
# transparent fill (C_BG=default) fg=${C_BG} renders as the terminal text
# colour, so a cap can't be "cut out" of a solid block, only drawn onto the fill.

# Inactive windows (Section C style), spaces stand in for the caps to keep width
set -g window-status-format "#[default,fg=${C_FG},bg=${C_BG}]  #W  "

# Active window (Section A style - highlighted)
set -g window-status-current-format "#[fg=${A_BG},bg=${C_BG},nobold,nounderscore,noitalics]#{@right_sep}#[fg=${A_FG},bg=${A_BG},bold] #W #[fg=${A_BG},bg=${C_BG},bold]#{@left_sep}"
