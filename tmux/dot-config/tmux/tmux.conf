# Change default prefix from C-b to C-t
unbind C-b
set-option -g prefix C-t
bind-key C-t send-prefix

# Create new windows and splits relative to your Home directory (~)
bind-key c new-window -c "~"
bind-key '"' split-window -c "~"
bind-key % split-window -h -c "~"

# Default command for macOS environment bootstrapping (retains your config)
set-option -g default-command "reattach-to-user-namespace -l $SHELL"

# terminal capability passes (True Color + Undercurls + Hyperlinks)
set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ",xterm-256color:RGB:usstyle:extkeys"
set-option -as terminal-features ",*:hyperlinks"
set-option -gq allow-passthrough on

# Enable modern extended keys passing (Csi-u format) for advanced hotkeys
set-option -g extended-keys on
set-option -g extended-keys-format csi-u

set-option -g history-limit 10000     # Keep large scrollback history buffers
set-option -g initial-repeat-time 250 # Shorten multi-key stroke repeat window
set-option -g display-time 1000       # Status line message stay duration (1s)
set-option -g renumber-windows on     # Close gaps in window numbers when closed

# Force tmux to run in full vi operational modes
set-window-option -g mode-keys vi
set-option -g @shell_mode 'vi'
bind-key -T copy-mode-vi 'v' send-key -X begin-selection

# I believe I can fly I believe I can touch the sky I think about it every
# night and day Spread my wings and fly away
bind-key -n M-H       select-pane   -L
bind-key -n M-J       select-pane   -D
bind-key -n M-K       select-pane   -U
bind-key -n M-L       select-pane   -R
bind-key -n M-S-Left  resize-pane   -L 5
bind-key -n M-S-Right resize-pane   -R 5
bind-key -n M-S-Up    resize-pane   -U 5
bind-key -n M-S-Down  resize-pane   -D 5
bind-key -n M-\{      switch-client -p
bind-key -n M-\}      switch-client -n
bind-key -n M-D       detach-client
bind-key -n M-Q       kill-pane
bind-key -n M-W       choose-tree   -Z
bind-key -n M-Z       resize-pane   -Z
bind-key -n M-N       next-window
bind-key -n M-P       previous-window
bind-key -n M-\|      copy-mode
bind-key -n M-%       split-window  -h -c "~"
bind-key -n M-\"      split-window  -c    "~"
bind-key -n M-C       new-window    -c    "~"

bind-key -n M-R source-file "$HOME/.config/tmux/tmux.conf" \; source-file "$HOME/.config/tmux/snapshot.conf" \; display "Reloaded!"
bind-key -n M-T run-shell "t_tt toggle"
bind-key -n M-F run-shell "tmux display-popup -E -w 100% -h 100% -b none 'TMUX_PANE=#{pane_id} t_fp'"
bind-key -n M-Y run-shell "tmux display-popup -E -w 100% -h 100% -b none 'TMUX_PANE=#{pane_id} \"$ZDOTDIR/plugins/fzf-clipboard/bin/fzf-clipboard-select\"' >&/dev/null &"
bind-key -n M-S run-shell "termsand"

source-file ~/.config/tmux/snapshot.conf

run-shell "$HOME/.config/tmux/plugins/tmux-now-playing/now-playing.tmux"
run-shell "$HOME/.config/tmux/plugins/tmux-yank/yank.tmux"
run-shell "$HOME/.config/tmux/plugins/tmux-copycat/copycat.tmux"
run-shell "$HOME/.config/tmux/plugins/tmux-resurrect/resurrect.tmux"
run-shell "$HOME/.config/tmux/plugins/tmux-nerd-font-window-name/tmux-nerd-font-window-name.tmux"
run-shell "$HOME/.config/tmux/plugins/tmux-fzf-complete/fzf-complete.tmux"
